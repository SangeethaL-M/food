{% extends 'base.html' %}
{% block title %}Login - FoodExpress{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-lg border-0 rounded-4 p-4 mt-4">
            <h3 class="fw-bold text-center mb-3 text-danger"><i class="fa-solid fa-lock me-2"></i>Login</h3>
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-danger w-100 py-2 fw-bold">Login</button>
            </form>
            <p class="text-center mt-3 text-muted">Don't have an account? <a href="{% url 'register' %}">Register here</a></p>
        </div>
    </div>
</div>
{% endblock %}
