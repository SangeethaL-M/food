{% extends 'base.html' %}
{% block title %}Register - FoodExpress{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-lg border-0 rounded-4 p-4">
            <h3 class="fw-bold text-center mb-3 text-danger"><i class="fa-solid fa-user-plus me-2"></i>Create Account</h3>
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label font-weight-bold">Username</label>
                    <input type="text" name="username" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Account Role</label>
                    <select name="role" class="form-select">
                        <option value="customer">Customer (Order Food)</option>
                        <option value="restaurant">Restaurant Owner</option>
                        <option value="delivery">Delivery Partner</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Phone</label>
                    <input type="text" name="phone" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Delivery Address</label>
                    <textarea name="address" class="form-control" rows="2"></textarea>
                </div>
                <button type="submit" class="btn btn-danger w-100 py-2 font-weight-bold">Register</button>
            </form>
            <p class="text-center mt-3 text-muted">Already have an account? <a href="{% url 'login' %}">Login here</a></p>
        </div>
    </div>
</div>
{% endblock %}
